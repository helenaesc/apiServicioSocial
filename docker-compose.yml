services:
  db:
    image: mysql:8.0
    container_name: poncho_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: poncho
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./poncho_backup.sql:/docker-entrypoint-initdb.d/poncho_backup.sql

  backend:
    build: .
    container_name: poncho_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: poncho
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  db_data: