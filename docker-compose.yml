services:
  db:
    image: mysql:8.0
    container_name: poncho_db_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: poncho
    ports:
      - "3307:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./sql/final:/docker-entrypoint-initdb.d


  backend:
    build: .
    container_name: poncho_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: poncho
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  db_data_dev: